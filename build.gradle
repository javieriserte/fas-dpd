import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestResult

plugins {
    id 'base'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        modularity.inferModulePath = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation platform('org.junit:junit-bom:5.8.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        workingDir = rootProject.projectDir
        useJUnitPlatform()
        testLogging {
            events "passed", "failed", "skipped"
            exceptionFormat = "short"
            showExceptions = true
            showCauses = true
            showStackTraces = false
        }
        addTestListener(new TestListener() {
            @Override
            void beforeSuite(TestDescriptor suite) {}

            @Override
            void afterSuite(TestDescriptor suite, TestResult result) {
                if (!suite.parent) {
                    println "Test summary: ${result.testCount} run, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
                }
            }

            @Override
            void beforeTest(TestDescriptor testDescriptor) {}

            @Override
            void afterTest(TestDescriptor testDescriptor, TestResult result) {}
        })
    }
}

tasks.register('run') {
    group = 'application'
    description = 'Runs the CLI application.'
    dependsOn ':fasdpd-cli:run'
}

tasks.register('runGui') {
    group = 'application'
    description = 'Runs the Swing GUI application.'
    dependsOn ':fasdpd-gui:runGui'
}
